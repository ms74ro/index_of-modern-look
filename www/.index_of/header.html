<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Index</title>
<script>
  /* Aplică tema salvată înainte de randare (fără „flash” alb). */
  (function () {
    try {
      var t = localStorage.getItem('idx-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      var v = localStorage.getItem('idx-view');
      if (v === 'grid') document.documentElement.setAttribute('data-view', 'grid');
    } catch (e) {}
    document.documentElement.className += ' js';
  })();
</script>
<link rel="stylesheet" href="/.index_of/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233b82f6' d='M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/%3E%3C/svg%3E">
</head>
<body>
<div class="shell">
  <header class="top">
    <nav class="crumbs" id="crumbs" aria-label="Path" data-i18n-aria-label="path"></nav>
    <div class="actions">
      <button type="button" class="iconbtn txt" id="langBtn" title="Language" aria-label="Language">EN</button>
      <button type="button" class="iconbtn" id="viewBtn" title="List / Grid" aria-label="Switch view"></button>
      <button type="button" class="iconbtn" id="themeBtn" title="Theme" aria-label="Switch theme"></button>
    </div>
  </header>

  <section class="hero">
    <h1 id="title">Index</h1>
    <p class="stats" id="stats"></p>
  </section>

  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="filter" placeholder="Search in this folder…" data-i18n-placeholder="search" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </label>
  </div>

  <main class="card">
    <div class="list-head" id="listHead">
      <button type="button" data-sort="name"><span data-i18n="col_name">Name</span><span class="arrow"></span></button>
      <button type="button" data-sort="date"><span data-i18n="col_date">Modified</span><span class="arrow"></span></button>
      <button type="button" data-sort="size"><span data-i18n="col_size">Size</span><span class="arrow"></span></button>
      <button type="button" data-sort="desc"><span data-i18n="col_desc">Description</span><span class="arrow"></span></button>
    </div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" hidden></div>

    <!-- Aici Apache inserează tabelul original (rămâne vizibil dacă JS e dezactivat) -->
    <div id="raw">
