# =====================================================================
#  Tema "Index of" disponibilă pe TOATE VirtualHost-urile
#  (IP direct, domeniu.ro, subdomenii etc.)
#
#  Container php:8.3-apache -> montează fișierul în:
#     /etc/apache2/conf-enabled/index-of.conf
#  Apache instalat pe host -> copiază în /etc/apache2/conf-available/
#     apoi: a2enconf index-of && systemctl reload apache2
#
#  Ajustează calea de mai jos la locul real al folderului .index_of
#  (calea DIN CONTAINER, nu de pe host).
# =====================================================================

Alias /.index_of /var/www/html/.index_of

<Directory /var/www/html/.index_of>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
