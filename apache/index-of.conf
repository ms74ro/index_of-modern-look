# =====================================================================
#  "Index of" theme available on ALL VirtualHosts
#  (direct IP, domain.com, subdomains, etc.)
#
#  Docker (php:*-apache) -> load the file as:
#     /etc/apache2/conf-enabled/index-of.conf
#     (COPY in the Dockerfile, or a bind mount)
#  Apache on the host   -> copy it to /etc/apache2/conf-available/
#     then: a2enconf index-of && systemctl reload apache2
#
#  Adjust the path below to the real location of the .index_of folder
#  (the path INSIDE the container, not on the host).
# =====================================================================

Alias /.index_of /var/www/html/.index_of

<Directory /var/www/html/.index_of>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
